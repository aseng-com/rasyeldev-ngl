<!-- file: admin.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - NGL Spammer V4.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Responsive improvements for admin panel */
        .admin-panel {
            max-width: 900px;
            margin: 0 auto;
            transition: all 0.3s ease;
        }

        .version-badge {
            background: linear-gradient(145deg, #00ffd0, #00a3ff);
            color: #0a0e1a;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        /* Table responsive */
        .table-responsive {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin: 15px 0;
            border-radius: 12px;
        }

        #userTable {
            min-width: 600px;
            width: 100%;
        }

        /* Modal/Swal style - Custom alert modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: #151e2c;
            border: 1px solid #253041;
            border-radius: 24px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            position: relative;
            animation: slideUp 0.3s ease;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(145deg, #00ffd0, #00a3ff);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 30px;
            color: #0a0e1a;
        }

        .modal-title {
            color: white;
            font-size: 24px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 20px;
        }

        .modal-info {
            background: #0f1a24;
            border: 1px solid #253041;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .modal-info-item {
            margin-bottom: 15px;
        }

        .modal-info-item:last-child {
            margin-bottom: 0;
        }

        .modal-info-label {
            color: #7f8fa6;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 5px;
        }

        .modal-info-value {
            background: #1e2b3a;
            border: 1px solid #253041;
            border-radius: 12px;
            padding: 12px 15px;
            color: #00ffd0;
            font-family: 'SF Mono', monospace;
            font-size: 16px;
            font-weight: 600;
            word-break: break-all;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-copy-btn {
            background: transparent;
            border: none;
            color: #00ffd0;
            cursor: pointer;
            font-size: 20px;
            padding: 5px 10px;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .modal-copy-btn:hover {
            background: #2a3a4a;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .modal-btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .modal-btn-primary {
            background: linear-gradient(145deg, #00ffd0, #00a3ff);
            color: #0a0e1a;
        }

        .modal-btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .modal-btn-secondary {
            background: #0f1a24;
            color: #7f8fa6;
            border: 1px solid #253041;
        }

        .modal-btn-secondary:hover {
            background: #1e2b3a;
            color: white;
        }

        .database-status {
            font-size: 11px;
            padding: 5px 10px;
            background: #0f1a24;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            .admin-panel {
                padding: 20px;
            }
            
            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            
            .header h2 {
                font-size: 20px;
            }
            
            .create-account-section,
            .user-list-section {
                padding: 15px;
            }
            
            .token-box {
                flex-direction: column;
            }
            
            .btn-copy {
                width: 100%;
            }
            
            .modal-content {
                width: 95%;
                padding: 20px;
            }
            
            .modal-info-value {
                font-size: 14px;
                flex-wrap: wrap;
            }
        }

        @media (max-width: 480px) {
            .admin-panel {
                padding: 15px;
            }
            
            .input-group input {
                font-size: 14px;
                padding: 12px;
            }
            
            .btn-create, .btn-logout {
                padding: 12px;
                font-size: 14px;
            }
            
            .modal-title {
                font-size: 20px;
            }
            
            .modal-buttons {
                flex-direction: column;
            }
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #00ffd0;
            color: #0a0e1a;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 5px 15px rgba(0, 255, 208, 0.3);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 2000;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.error {
            background: #ff5e7c;
            box-shadow: 0 5px 15px rgba(255, 94, 124, 0.3);
        }

        /* Loading animation */
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(0, 255, 208, 0.3);
            border-radius: 50%;
            border-top-color: #00ffd0;
            animation: spin 1s ease-in-out infinite;
            margin-right: 5px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .footer-note {
            text-align: center;
            margin-top: 20px;
            color: #4a5a6e;
            font-size: 10px;
            border-top: 1px solid #253041;
            padding-top: 15px;
        }
        
        .footer-note span {
            color: #00ffd0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="admin-panel">
            <div class="header">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <h2>Admin Panel V4.0</h2>
                    <span class="version-badge">✨ DATABASE: db.json ✨</span>
                </div>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <span class="database-status" id="dbStatus">
                        <span id="dbIcon">⏳</span> 
                        <span id="dbText">Memuat...</span>
                    </span>
                    <button id="logoutBtn" class="btn-logout">Logout</button>
                </div>
            </div>
            
            <div class="create-account-section">
                <h3>Buat Akun Baru</h3>
                <div class="input-group">
                    <label for="newUsername">Username</label>
                    <input type="text" id="newUsername" placeholder="Masukkan username">
                </div>
                <button id="createAccountBtn" class="btn-create">
                    <span>✨</span> Create Account
                </button>
                
                <div id="tokenResult" class="token-result" style="display: none;">
                    <p>Token berhasil dibuat:</p>
                    <div class="token-box">
                        <code id="generatedToken"></code>
                        <button id="copyTokenBtn" class="btn-copy">Copy</button>
                    </div>
                </div>
            </div>

            <div class="user-list-section">
                <h3>Daftar User</h3>
                <div class="table-responsive">
                    <table id="userTable">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Username</th>
                                <th>Token</th>
                                <th>Role</th>
                            </tr>
                        </thead>
                        <tbody id="userList">
                            <!-- akan diisi oleh JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
            
            <div class="footer-note">
                <p>© 2024 <span>RASYEL DEV</span> • Aplikasi telah diupdate ke versi 4.0 dengan database db.json</p>
            </div>
        </div>
    </div>

    <!-- Custom Modal -->
    <div id="successModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-icon">✨</div>
            <h3 class="modal-title">Akun Berhasil Dibuat!</h3>
            <div class="modal-info">
                <div class="modal-info-item">
                    <div class="modal-info-label">Username</div>
                    <div class="modal-info-value" id="modalUsername">-</div>
                </div>
                <div class="modal-info-item">
                    <div class="modal-info-label">Token</div>
                    <div class="modal-info-value" id="modalToken">
                        <span id="modalTokenText">-</span>
                        <button class="modal-copy-btn" id="modalCopyBtn" title="Salin token">📋</button>
                    </div>
                </div>
            </div>
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-primary" id="modalCloseBtn">OK</button>
                <button class="modal-btn modal-btn-secondary" id="modalCopyAllBtn">Salin Semua</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>
    
    <script>
        // URL ke file db.json
        const DB_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
            ? 'db.json' 
            : window.location.pathname.includes('/') 
                ? window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/')) + '/db.json'
                : 'db.json';
        
        // Variabel global
        let database = { users: [] };
        let currentUser = null;
        
        // Fungsi untuk memuat database
        async function loadDatabase() {
            const dbIcon = document.getElementById('dbIcon');
            const dbText = document.getElementById('dbText');
            
            try {
                // Cek session dulu
                const session = JSON.parse(sessionStorage.getItem('session'));
                if (!session) {
                    window.location.href = 'index.html';
                    return null;
                }
                currentUser = session;
                
                // Load database
                const response = await fetch(DB_URL + '?t=' + new Date().getTime());
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                database = data;
                
                // Simpan ke sessionStorage
                sessionStorage.setItem('database', JSON.stringify(data));
                
                dbIcon.innerHTML = '✅';
                dbText.innerHTML = 'Database terhubung';
                
                return data;
            } catch (error) {
                console.error('Error loading database:', error);
                dbIcon.innerHTML = '❌';
                dbText.innerHTML = 'Gagal memuat database';
                
                // Coba ambil dari sessionStorage
                const cachedDb = sessionStorage.getItem('database');
                if (cachedDb) {
                    database = JSON.parse(cachedDb);
                    dbIcon.innerHTML = '⚠️';
                    dbText.innerHTML = 'Mode cache';
                    return database;
                }
                
                return null;
            }
        }
        
        // Fungsi untuk menyimpan database (simulasi - sebenarnya perlu backend)
        function saveDatabase() {
            // Dalam implementasi nyata, ini harus POST ke backend
            // Untuk simulasi, kita simpan di sessionStorage dan localStorage
            sessionStorage.setItem('database', JSON.stringify(database));
            localStorage.setItem('users', JSON.stringify(database.users));
            
            // Tampilkan notifikasi bahwa ini hanya simulasi
            showToast('Data tersimpan (mode simulasi)', 'success');
        }
        
        // Generate token random
        function generateToken(length = 8) {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let token = '';
            for (let i = 0; i < length; i++) {
                token += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return token;
        }
        
        // Tampilkan daftar user
        function displayUserList() {
            const userList = document.getElementById('userList');
            if (!userList) return;
            
            userList.innerHTML = '';
            
            if (!database.users || database.users.length === 0) {
                const row = document.createElement('tr');
                row.innerHTML = `<td colspan="4" style="text-align: center; color: #7f8fa6; padding: 30px;">Belum ada user</td>`;
                userList.appendChild(row);
                return;
            }
            
            database.users.forEach(user => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${user.id || '-'}</td>
                    <td>${escapeHtml(user.username)}</td>
                    <td>${escapeHtml(user.token)}</td>
                    <td>${escapeHtml(user.role)}</td>
                `;
                userList.appendChild(row);
            });
        }
        
        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Toast notification
        function showToast(message, type = 'success', duration = 3000) {
            const toast = document.getElementById('toast');
            if (!toast) return;
            
            toast.textContent = message;
            toast.className = 'toast ' + (type === 'error' ? 'error' : '');
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, duration);
        }
        
        // Show modal
        function showSuccessModal(username, token) {
            const modal = document.getElementById('successModal');
            const modalUsername = document.getElementById('modalUsername');
            const modalTokenText = document.getElementById('modalTokenText');
            
            modalUsername.textContent = username;
            modalTokenText.textContent = token;
            modal.style.display = 'flex';
        }
        
        // Close modal
        function closeModal() {
            document.getElementById('successModal').style.display = 'none';
        }
        
        // Inisialisasi
        document.addEventListener('DOMContentLoaded', async function() {
            // Load database
            await loadDatabase();
            displayUserList();
            
            // Event listeners
            const createBtn = document.getElementById('createAccountBtn');
            const copyBtn = document.getElementById('copyTokenBtn');
            const logoutBtn = document.getElementById('logoutBtn');
            const modalCloseBtn = document.getElementById('modalCloseBtn');
            const modalCopyBtn = document.getElementById('modalCopyBtn');
            const modalCopyAllBtn = document.getElementById('modalCopyAllBtn');
            
            if (createBtn) {
                createBtn.addEventListener('click', function() {
                    const newUsername = document.getElementById('newUsername').value.trim();
                    
                    if (!newUsername) {
                        showToast('Username tidak boleh kosong!', 'error');
                        return;
                    }
                    
                    // Cek username sudah ada
                    if (database.users.some(u => u.username === newUsername)) {
                        showToast('Username sudah digunakan!', 'error');
                        return;
                    }
                    
                    // Generate ID baru
                    const newId = String(database.users.length + 1);
                    const token = generateToken();
                    
                    // Tambah user
                    const newUser = {
                        id: newId,
                        username: newUsername,
                        token: token,
                        role: 'user'
                    };
                    
                    database.users.push(newUser);
                    
                    // Simpan
                    saveDatabase();
                    
                    // Tampilkan token
                    document.getElementById('generatedToken').textContent = token;
                    document.getElementById('tokenResult').style.display = 'block';
                    
                    // Reset input
                    document.getElementById('newUsername').value = '';
                    
                    // Update tabel
                    displayUserList();
                    
                    // Tampilkan modal
                    showSuccessModal(newUsername, token);
                    showToast(`Akun ${newUsername} berhasil dibuat!`);
                });
            }
            
            // Copy token dari result box
            if (copyBtn) {
                copyBtn.addEventListener('click', function() {
                    const token = document.getElementById('generatedToken').textContent;
                    navigator.clipboard.writeText(token).then(() => {
                        showToast('Token berhasil disalin!');
                    });
                });
            }
            
            // Copy token dari modal
            if (modalCopyBtn) {
                modalCopyBtn.addEventListener('click', function() {
                    const token = document.getElementById('modalTokenText').textContent;
                    navigator.clipboard.writeText(token).then(() => {
                        showToast('Token berhasil disalin!');
                    });
                });
            }
            
            // Copy semua
            if (modalCopyAllBtn) {
                modalCopyAllBtn.addEventListener('click', function() {
                    const username = document.getElementById('modalUsername').textContent;
                    const token = document.getElementById('modalTokenText').textContent;
                    navigator.clipboard.writeText(`Username: ${username}\nToken: ${token}`).then(() => {
                        showToast('Username dan token disalin!');
                    });
                });
            }
            
            // Close modal
            if (modalCloseBtn) {
                modalCloseBtn.addEventListener('click', closeModal);
            }
            
            // Logout
            if (logoutBtn) {
                logoutBtn.addEventListener('click', function() {
                    sessionStorage.removeItem('session');
                    sessionStorage.removeItem('database');
                    window.location.href = 'index.html';
                });
            }
            
            // Click outside modal
            window.addEventListener('click', function(event) {
                const modal = document.getElementById('successModal');
                if (event.target === modal) {
                    closeModal();
                }
            });
        });
    </script>
</body>
</html>
