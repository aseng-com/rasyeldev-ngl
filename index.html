<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistem Token</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="login-box">
            <h2>Login</h2>
            <p>Masukkan username dan token Anda</p>
            <form id="loginForm">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Masukkan username" required>
                </div>
                <div class="input-group">
                    <label for="token">Token</label>
                    <input type="text" id="token" placeholder="Masukkan token" required>
                </div>
                <button type="submit" class="btn-login">Login</button>
                <p id="errorMessage" class="error-message"></p>
            </form>
        </div>
    </div>
    
    <script>
        // Fungsi untuk mendapatkan base URL
        function getBaseUrl() {
            const currentUrl = window.location.href;
            const pathArray = currentUrl.split('/');
            // Ambil sampai direktori root (tanpa filename)
            return pathArray.slice(0, -1).join('/') + '/';
        }

        // Fungsi untuk validasi session dengan database
        function validateSession(session) {
            if (!session) return false;
            
            try {
                // Ambil users dari localStorage
                const users = JSON.parse(localStorage.getItem('users')) || [];
                
                // Cari user yang sesuai dengan session
                const user = users.find(u => 
                    u.username === session.username && 
                    u.token === session.token && 
                    u.role === session.role
                );
                
                return user !== undefined;
            } catch (e) {
                console.error('Error validating session:', e);
                return false;
            }
        }

        // Inisialisasi data default jika belum ada
        function initializeData() {
            try {
                let users = localStorage.getItem('users');
                if (!users) {
                    // Data default
                    const defaultUsers = [
                        { username: 'admin', token: 'admin123', role: 'admin' },
                        { username: 'user1', token: 'user123', role: 'user' }
                    ];
                    localStorage.setItem('users', JSON.stringify(defaultUsers));
                    console.log('Data default initialized');
                }
            } catch (e) {
                console.error('Error initializing data:', e);
            }
        }

        // Cek localStorage availability
        function isLocalStorageAvailable() {
            try {
                const test = '__test__';
                localStorage.setItem(test, test);
                localStorage.removeItem(test);
                return true;
            } catch (e) {
                console.error('localStorage not available:', e);
                return false;
            }
        }

        // Handle page load
        (function() {
            console.log('Page loaded, checking localStorage...');
            
            // Cek apakah localStorage tersedia
            if (!isLocalStorageAvailable()) {
                document.getElementById('errorMessage').textContent = 
                    'Browser Anda tidak mendukung localStorage. Silakan gunakan browser lain.';
                return;
            }
            
            // Initialize data
            initializeData();
            
            // Cek session
            try {
                const session = JSON.parse(localStorage.getItem('session'));
                console.log('Existing session:', session);
                
                if (session && validateSession(session)) {
                    // Session valid, redirect sesuai role
                    const baseUrl = getBaseUrl();
                    if (session.role === 'admin') {
                        window.location.href = baseUrl + 'admin.html';
                    } else if (session.role === 'user') {
                        window.location.href = baseUrl + 'user.html';
                    }
                } else if (session) {
                    // Session tidak valid, hapus
                    localStorage.removeItem('session');
                    console.log('Invalid session removed');
                }
            } catch (e) {
                console.error('Error checking session:', e);
            }
        })();

        // Handle login form
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const token = document.getElementById('token').value.trim();
            const errorMessage = document.getElementById('errorMessage');
            
            try {
                // Ambil users dari localStorage
                const users = JSON.parse(localStorage.getItem('users')) || [];
                
                // Cari user
                const user = users.find(u => u.username === username && u.token === token);
                
                if (user) {
                    // Simpan session
                    localStorage.setItem('session', JSON.stringify({
                        username: user.username,
                        token: user.token,
                        role: user.role
                    }));
                    
                    console.log('Login successful:', user.username);
                    
                    // Redirect berdasarkan role
                    const baseUrl = getBaseUrl();
                    if (user.role === 'admin') {
                        window.location.href = baseUrl + 'admin.html';
                    } else {
                        window.location.href = baseUrl + 'user.html';
                    }
                } else {
                    errorMessage.textContent = 'Username atau token salah!';
                    console.log('Login failed: invalid credentials');
                }
            } catch (e) {
                console.error('Error during login:', e);
                errorMessage.textContent = 'Terjadi kesalahan. Silakan coba lagi.';
            }
        });
    </script>
</body>
</html>
