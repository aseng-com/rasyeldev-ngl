<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistem Token</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="login-box">
            <h2>Login</h2>
            <p>Masukkan username dan token Anda</p>
            <form id="loginForm">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Masukkan username" required>
                </div>
                <div class="input-group">
                    <label for="token">Token</label>
                    <input type="text" id="token" placeholder="Masukkan token" required>
                </div>
                <button type="submit" class="btn-login">Login</button>
                <p id="errorMessage" class="error-message"></p>
            </form>
            <div class="contact-info">
                <p>Untuk mendapatkan akses login, silahkan hubungi admin:</p>
                <a href="https://wa.me/6281533333419" class="wa-link" target="_blank">
                    <span class="wa-icon">📱</span> 0815-3333-3419
                </a>
            </div>
        </div>
    </div>
    
    <script>
        // Fungsi untuk validasi session dengan database
        function validateSession(session) {
            if (!session) return false;
            
            // Ambil users dari localStorage
            const users = JSON.parse(localStorage.getItem('users')) || [];
            
            // Cari user yang sesuai dengan session
            const user = users.find(u => 
                u.username === session.username && 
                u.token === session.token && 
                u.role === session.role
            );
            
            return user !== undefined;
        }

        // Cek session saat halaman dimuat
        (function() {
            const session = JSON.parse(localStorage.getItem('session'));
            
            if (session) {
                // Validasi session dengan database
                if (validateSession(session)) {
                    // Session valid, redirect sesuai role
                    if (session.role === 'admin') {
                        window.location.href = 'admin.html';
                    } else if (session.role === 'user') {
                        window.location.href = 'user.html';
                    }
                } else {
                    // Session tidak valid, hapus
                    localStorage.removeItem('session');
                }
            }
        })();

        // Handle login form
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const token = document.getElementById('token').value.trim();
            const errorMessage = document.getElementById('errorMessage');
            
            // Ambil users dari localStorage
            const users = JSON.parse(localStorage.getItem('users')) || [];
            
            // Cari user
            const user = users.find(u => u.username === username && u.token === token);
            
            if (user) {
                // Simpan session
                localStorage.setItem('session', JSON.stringify({
                    username: user.username,
                    token: user.token,
                    role: user.role
                }));
                
                // Redirect berdasarkan role
                if (user.role === 'admin') {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = 'user.html';
                }
            } else {
                errorMessage.textContent = 'Username atau token salah!';
            }
        });
    </script>
</body>
</html>
