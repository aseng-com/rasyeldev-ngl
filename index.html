<!-- file: index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NGL Spammer V4.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .version-badge {
            background: linear-gradient(145deg, #00ffd0, #00a3ff);
            color: #0a0e1a;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 15px;
        }
        
        .api-status {
            font-size: 12px;
            margin-bottom: 15px;
            padding: 8px;
            background: #0f1a24;
            border-radius: 8px;
            border: 1px solid #253041;
        }
        
        .login-footer {
            margin-top: 20px;
            text-align: center;
            color: #4a5a6e;
            font-size: 11px;
            border-top: 1px solid #253041;
            padding-top: 15px;
        }
        
        .login-footer span {
            color: #00ffd0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-box">
            <div style="text-align: center; margin-bottom: 10px;">
                <span class="version-badge">✨ VERSI 4.0 ✨</span>
            </div>
            <h2>NGL SPAMMER</h2>
            <p>BY RASYEL DEV • Sistem Login Terbaru</p>
            
            <div class="api-status" id="apiStatus">
                <span id="statusIcon">⏳</span> 
                <span id="statusText">Menyambung ke database...</span>
            </div>
            
            <form id="loginForm">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Masukkan username" required>
                </div>
                <div class="input-group">
                    <label for="token">Token</label>
                    <input type="text" id="token" placeholder="Masukkan token" required>
                </div>
                <button type="submit" class="btn-login" id="loginBtn">
                    <span>🔐</span> Login ke Panel
                </button>
                <p id="errorMessage" class="error-message"></p>
            </form>
            
            <div class="login-footer">
                <p>© 2024 <span>RASYEL DEV</span> • Aplikasi telah diupdate ke versi 4.0</p>
                <p style="margin-top: 5px; font-size: 9px;">Database: db.json • Multi-User Support</p>
            </div>
        </div>
    </div>
    
    <script>
        // URL ke file db.json - Sesuaikan dengan lokasi hosting
        // Untuk localhost: 'db.json'
        // Untuk GitHub Pages: '/nama-repository/db.json' atau './db.json'
        const DB_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
            ? 'db.json' 
            : window.location.pathname.includes('/') 
                ? window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/')) + '/db.json'
                : 'db.json';
        
        // Fungsi untuk memuat database
        async function loadDatabase() {
            const statusIcon = document.getElementById('statusIcon');
            const statusText = document.getElementById('statusText');
            
            try {
                const response = await fetch(DB_URL + '?t=' + new Date().getTime()); // Cache busting
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                console.log('Database loaded:', data);
                
                // Simpan ke sessionStorage agar bisa diakses halaman lain
                sessionStorage.setItem('database', JSON.stringify(data));
                
                statusIcon.innerHTML = '✅';
                statusText.innerHTML = 'Database terhubung';
                statusText.style.color = '#00ffd0';
                
                return data;
            } catch (error) {
                console.error('Error loading database:', error);
                statusIcon.innerHTML = '❌';
                statusText.innerHTML = 'Gagal memuat database';
                statusText.style.color = '#ff5e7c';
                
                // Fallback ke localStorage jika db.json tidak bisa diakses
                const localData = localStorage.getItem('users');
                if (localData) {
                    statusIcon.innerHTML = '⚠️';
                    statusText.innerHTML = 'Mode offline (localStorage)';
                    statusText.style.color = '#ffa500';
                    return { users: JSON.parse(localData) };
                }
                
                return null;
            }
        }

        // Cek session yang masih aktif
        async function checkActiveSession() {
            const session = JSON.parse(sessionStorage.getItem('session'));
            if (!session) return;
            
            const db = await loadDatabase();
            if (!db) return;
            
            // Validasi session dengan database
            const user = db.users.find(u => u.id === session.id);
            
            if (user && user.role === session.role) {
                // Session valid, redirect
                if (user.role === 'admin') {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = 'user.html';
                }
            } else {
                // Session tidak valid
                sessionStorage.removeItem('session');
            }
        }

        // Handle login
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const token = document.getElementById('token').value.trim();
            const errorMessage = document.getElementById('errorMessage');
            const loginBtn = document.getElementById('loginBtn');
            
            errorMessage.textContent = '';
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="loading"></span> Memproses...';
            
            try {
                // Load database
                const db = await loadDatabase();
                
                if (!db) {
                    errorMessage.textContent = 'Tidak dapat mengakses database';
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<span>🔐</span> Login ke Panel';
                    return;
                }
                
                // Cari user
                const user = db.users.find(u => u.username === username && u.token === token);
                
                if (user) {
                    // Simpan session
                    sessionStorage.setItem('session', JSON.stringify({
                        id: user.id,
                        username: user.username,
                        role: user.role
                    }));
                    
                    // Simpan database ke sessionStorage untuk halaman lain
                    sessionStorage.setItem('database', JSON.stringify(db));
                    
                    // Redirect berdasarkan role
                    if (user.role === 'admin') {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'user.html';
                    }
                } else {
                    errorMessage.textContent = 'Username atau token salah!';
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<span>🔐</span> Login ke Panel';
                }
            } catch (error) {
                console.error('Login error:', error);
                errorMessage.textContent = 'Terjadi kesalahan. Coba lagi.';
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<span>🔐</span> Login ke Panel';
            }
        });

        // Inisialisasi
        (async function() {
            await loadDatabase();
            await checkActiveSession();
        })();
    </script>
</body>
</html>
